name = "bsm-storage"
main = "index.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bsm-files"

# Set these in the Cloudflare dashboard (Worker -> Settings -> Variables):
#   UPLOAD_TOKEN   (secret)  shared secret, must match the app's Settings -> Storage
#   PUBLIC_BASE    (var)     e.g. https://files.yourdomain.com  (omit to stream via /file/<key>)
#   ALLOWED_ORIGIN (var)     e.g. https://hello-world-joy-010.lovable.app,http://localhost:8080
