<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>You're offline — BSM WOMS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(120% 120% at 50% 0%, #16203a 0%, #0b1220 60%);
        color: #e8ecf7;
        font-family: Roboto, Inter, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        padding: 32px 28px;
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 18px 0 8px; }
      p { font-size: 14px; line-height: 1.6; margin: 0; color: rgba(232, 236, 247, 0.7); }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        color: #0b1220;
        background: #8aa2ff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/app-icon-192.png" alt="BSM WOMS" />
      <h1>You're offline</h1>
      <p>
        BSM WOMS needs an internet connection to load workforce, attendance and billing data.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
